<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3B6D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pénates">
<title>Pénates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--green:#3B6D11;--green-mid:#639922;--green-light:#EAF3DE;--green-border:#C0DD97;--teal:#0F6E56;--teal-light:#E1F5EE;--teal-border:#9FE1CB;--amber-light:#FAEEDA;--amber:#BA7517;--bg:#F2F5EE;--surface:#FFFFFF;--border:rgba(0,0,0,0.1);--border-med:rgba(0,0,0,0.18);--text:#1a1a18;--text-sec:#5F5E5A;--text-hint:#999;--radius:10px;--radius-sm:7px;}
@media(prefers-color-scheme:dark){:root{--bg:#0F1F16;--surface:#16281D;--border:rgba(255,255,255,0.1);--border-med:rgba(255,255,255,0.18);--text:#F1EFE8;--text-sec:#B4B2A9;--text-hint:#6B7A70;--green-light:#1e2e10;--green-border:#3B6D11;--teal-light:#0d2520;--teal-border:#0F6E56;--amber-light:#2a1e08;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;max-width:480px;margin:0 auto;}
.header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:0.5px solid var(--border);padding:.75rem 1rem;display:flex;align-items:center;gap:10px;}
.header-icon{width:30px;height:30px;border-radius:var(--radius-sm);background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:16px;}
.header h1{font-size:15px;font-weight:500;flex:1;}
.sync-status{width:7px;height:7px;border-radius:50%;background:var(--text-hint);flex-shrink:0;transition:background .3s;}
.sync-status.synced{background:#639922;}
.sync-status.syncing{background:#BA7517;animation:pulse 1s infinite;}
.sync-status.error{background:#C0392B;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.week-info{font-size:11px;color:var(--text-hint);}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:0.5px solid var(--border);display:flex;z-index:10;}
.nav-btn{flex:1;padding:.75rem .5rem .85rem;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text-hint);font-size:10px;font-family:inherit;}
.nav-btn.active{color:var(--green);}
.nav-btn svg{width:22px;height:22px;stroke-width:1.5;fill:none;stroke:currentColor;}
.main{padding:.85rem 1rem 6rem;}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:.9rem 1rem;margin-bottom:.6rem;}
.suggest-bar{display:flex;gap:.5rem;margin-bottom:.9rem;}
.btn{padding:.55rem 1rem;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;cursor:pointer;border:0.5px solid var(--border-med);background:var(--surface);color:var(--text);font-weight:500;}
.btn:active{opacity:.7;}
.btn-primary{background:var(--green-light);border-color:var(--green-border);color:var(--green);}
.day-row{display:grid;grid-template-columns:68px 1fr 36px;align-items:center;gap:7px;padding:.45rem 0;}
.day-label{font-size:12px;color:var(--text-sec);font-weight:500;}
.day-label.sun{color:var(--green);}
.day-select{font-size:12px;padding:.38rem .5rem;border-radius:var(--radius-sm);border:0.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;width:100%;appearance:none;-webkit-appearance:none;cursor:pointer;}
.day-select.suggested{border-color:var(--teal-border);background:var(--teal-light);}
.day-select.validated{border-color:var(--green-border);background:var(--green-light);}
.validate-btn{width:30px;height:30px;border-radius:var(--radius-sm);border:0.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-hint);}
.validate-btn.ok{border-color:var(--green-border);background:var(--green-light);color:var(--green);}
.validate-btn svg{width:14px;height:14px;stroke-width:2.5;fill:none;stroke:currentColor;}
.legend{display:flex;gap:10px;margin-bottom:.8rem;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-hint);}
.dot{width:8px;height:8px;border-radius:50%;}
.search-input{width:100%;padding:.55rem .8rem;border-radius:var(--radius-sm);border:0.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;margin-bottom:.75rem;}
.filter-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.75rem;}
.filter-btn{padding:.3rem .75rem;border-radius:99px;border:0.5px solid var(--border);background:transparent;color:var(--text-sec);font-size:11px;font-family:inherit;cursor:pointer;}
.filter-btn.active{background:var(--green-light);border-color:var(--green-border);color:var(--green);}
.dish-item{display:flex;align-items:center;gap:8px;padding:.6rem 0;border-bottom:0.5px solid var(--border);}
.dish-item:last-child{border-bottom:none;}
.dish-name-txt{flex:1;font-size:13px;color:var(--text);}
.cat-badge{font-size:10px;padding:2px 7px;border-radius:99px;flex-shrink:0;}
.cat-vege{background:var(--green-light);color:var(--green);}
.cat-poisson{background:var(--teal-light);color:var(--teal);}
.cat-viande{background:var(--amber-light);color:var(--amber);}
.add-dish-btn{font-size:11px;padding:.3rem .6rem;border-radius:var(--radius-sm);border:0.5px solid var(--border);background:transparent;color:var(--text-sec);font-family:inherit;cursor:pointer;flex-shrink:0;}
.courses-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;}
.section-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-hint);}
.clear-btn{font-size:12px;color:var(--text-hint);background:none;border:none;cursor:pointer;font-family:inherit;}
.course-add{display:flex;gap:.5rem;margin-bottom:.6rem;}
.course-add input{flex:1;padding:.55rem .8rem;border-radius:var(--radius-sm);border:0.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;}
.course-add button{padding:.55rem .9rem;border-radius:var(--radius-sm);border:0.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;cursor:pointer;font-size:16px;}
.ing-row{display:flex;align-items:center;gap:9px;padding:.4rem 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.ing-row:last-child{border-bottom:none;}
.ing-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--green-mid);flex-shrink:0;cursor:pointer;}
.ing-row label{flex:1;cursor:pointer;color:var(--text);}
.ing-row label.done{text-decoration:line-through;color:var(--text-hint);}
.remove-ing{width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:var(--text-hint);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;padding:0;}
.remove-ing:active{background:var(--amber-light);color:var(--amber);}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:13px;padding:.5rem 1.1rem;border-radius:99px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.empty{text-align:center;padding:2rem 1rem;color:var(--text-hint);font-size:13px;line-height:1.6;}
.soup-tag{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--teal-light);color:var(--teal);margin-left:5px;vertical-align:middle;}
.loading{text-align:center;padding:3rem 1rem;color:var(--text-hint);font-size:13px;}
.loading-spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto .75rem;}
@keyframes spin{to{transform:rotate(360deg);}}
.sync-btn{font-size:11px;color:var(--text-hint);background:none;border:0.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;padding:3px 8px;font-family:inherit;}
.sync-btn:hover{color:var(--green);border-color:var(--green-border);}
</style>
</head>
<body>
<div class="header">
  <div class="header-icon">🏺</div>
  <h1>Pénates</h1>
  <div style="flex:1"></div>
  <button class="sync-btn" onclick="window.navigateWeek(-1)" title="Semaine précédente" style="padding:3px 7px;">‹</button>
  <span id="week-offset-label" style="font-size:11px;color:var(--text-hint);min-width:16px;text-align:center;"></span>
  <button class="sync-btn" onclick="window.navigateWeek(1)" title="Semaine suivante" style="padding:3px 7px;">›</button>
  <button class="sync-btn" onclick="syncFromSheet()" title="Sync recettes" style="margin-left:4px;">↻</button>
  <div class="sync-status" id="sync-dot" title="Statut sync"></div>
  <span class="week-info" id="week-info" style="margin-left:6px;"></span>
</div>
<div class="main" id="main"><div class="loading"><div class="loading-spinner"></div>Chargement…</div></div>
<div class="toast" id="toast"></div>
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-semaine" onclick="showTab('semaine')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Semaine
  </button>
  <button class="nav-btn" id="nav-bdd" onclick="showTab('bdd')">
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
    Base plats
  </button>
  <button class="nav-btn" id="nav-courses" onclick="showTab('courses')">
    <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    Courses
  </button>
</nav>

<script type="module">
// ── FIREBASE ─────────────────────────────────────────────────────────
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, onSnapshot, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAvNm3Yqf-kOyNEsg8FSFq_oOw-mSoMSJ8",
  authDomain: "penates-lcrnl.firebaseapp.com",
  projectId: "penates-lcrnl",
  storageBucket: "penates-lcrnl.firebasestorage.app",
  messagingSenderId: "988641373573",
  appId: "1:988641373573:web:ae756cc07e2a9abf4fe8ec"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const CACHE_DOC = doc(db, 'penates', 'recipes_cache');

// ── CONFIG SHEETS ─────────────────────────────────────────────────────
const SHEET_ID  = '1wpZghmjxdKWCYMNF6h5IGmCzFCppJPFFXfZpvbMp3As'; // copie sous compte perso (indépendante du compte pro)
const API_KEY   = 'AIzaSyBGby5SE8IuO-5X8Em8UoHFrISftEehkTQ';
const SHEET_TAB = 'Recettes - Meal Planner v2';

// Relais d'écriture (Google Apps Script) pour ajouter une recette depuis l'app.
const ADD_RECIPE_URL = 'https://script.google.com/macros/s/AKfycbxj9i0ISpEVW7NbH0ek63ubQ6SYgp5s5NUuTAlPeW7JpTPAWHJeQCHyBNCrbZQKAZG3PQ/exec';
const ADD_RECIPE_SECRET = '74a4c3bf300338774b6e55e9d0db5658'; // doit correspondre au SECRET du script Apps Script

// ── GLOBALS ───────────────────────────────────────────────────────────
const isSummer=()=>{const m=new Date().getMonth();return m>=4&&m<=8;};
// Index = Date.getDay() (0=dimanche...6=samedi), utilisé pour la rotation des jours.
const DAY_BY_JSIDX=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
let weekStartDay='Samedi'; // réglage utilisateur, synchronisé via Firestore (penates/settings)
function computeDAYS(){
  const idx=DAY_BY_JSIDX.indexOf(weekStartDay);
  return[0,1,2,3,4,5,6].map(i=>DAY_BY_JSIDX[(idx+i)%7]);
}
let DAYS=computeDAYS();
let DB=[],ALL_DISHES=[],SOUPS=[];
let currentFilter='all',currentTab='semaine';
let addDishOpen=false,addDishName='',addDishCatOverride=null;
let addDishRows=[{text:'',cat:'Légumes'},{text:'',cat:'Légumes'},{text:'',cat:'Épices'}];
let checkedItems=new Set(),hiddenItems=new Set();
let remoteWriteTimeout=null;
let ignoreNextSnapshot=false;
let weekOffset=0; // 0 = semaine en cours, -1 = semaine passée, +1 = semaine prochaine
let currentUnsubscribe=null;

// ── SETTINGS (jour de début de semaine) ────────────────────────────────
const SETTINGS_DOC=doc(db,'penates','settings');
async function loadSettings(){
  try{
    const snap=await getDoc(SETTINGS_DOC);
    const d=snap.exists()?snap.data().weekStartDay:null;
    if(d&&DAY_BY_JSIDX.includes(d))weekStartDay=d;
  }catch(_){}
  DAYS=computeDAYS();
}
async function setWeekStartDay(day){
  if(day===weekStartDay)return;
  weekStartDay=day;DAYS=computeDAYS();
  try{await setDoc(SETTINGS_DOC,{weekStartDay:day});}catch(e){console.error(e);}
  updateWeekHeader();renderCurrent();
}

// ── WEEK KEY (used as Firestore doc ID) ───────────────────────────────
// NB: toISOString() convertit en UTC, ce qui décale la clé d'un jour selon le fuseau
// (bug déjà présent avant cette refonte, cf. l'ancien getSaturdayKey). On garde ce
// comportement tel quel ici pour ne pas casser la continuité avec les semaines déjà
// enregistrées dans Firestore sous l'ancienne clé — à corriger séparément si besoin,
// avec une migration des docs existants.
function getWeekStartKey(offset=0){
  const n=new Date(),d=n.getDay();
  const startIdx=DAY_BY_JSIDX.indexOf(weekStartDay);
  const diff=-((d-startIdx+7)%7);
  const start=new Date(n);
  start.setDate(n.getDate()+diff+(offset*7));
  start.setHours(0,0,0,0);
  return start.toISOString().slice(0,10); // e.g. "2025-06-21"
}
function getWeekLabel(offset=0){
  const key=getWeekStartKey(offset);
  const start=new Date(key);
  const end=new Date(start);end.setDate(start.getDate()+6);
  const fmt=dt=>dt.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  return`${fmt(start)} — ${fmt(end)}`;
}
function stateDocForOffset(offset){
  return doc(db,'penates','week_'+getWeekStartKey(offset));
}

// ── SYNC STATUS DOT ───────────────────────────────────────────────────
function setSyncStatus(s){const d=document.getElementById('sync-dot');if(d){d.className='sync-status '+s;}}

// ── STATE (in memory, synced via Firestore) ───────────────────────────
let state={
  weekPlan:{},validated:{},weekCustom:{},
  extraCourses:[],hygiene:[],epicerie:[],boissons:[],frais:[],legumes:[],
  checkedItems:[],hiddenItems:[]
};

function applyRemoteState(data){
  if(!data)return;
  Object.assign(state,data);
  checkedItems=new Set(state.checkedItems||[]);
  hiddenItems=new Set(state.hiddenItems||[]);
}

// Debounced write to Firestore — batches rapid changes
function saveState(){
  state.checkedItems=[...checkedItems];
  state.hiddenItems=[...hiddenItems];
  setSyncStatus('syncing');
  clearTimeout(remoteWriteTimeout);
  remoteWriteTimeout=setTimeout(async()=>{
    try{
      ignoreNextSnapshot=true;
      await setDoc(stateDocForOffset(weekOffset),state);
      setSyncStatus('synced');
    }catch(e){setSyncStatus('error');console.error(e);}
  },600);
}

// Real-time listener — updates all open devices instantly
function listenState(){
  if(currentUnsubscribe)currentUnsubscribe(); // stop previous listener
  currentUnsubscribe=onSnapshot(stateDocForOffset(weekOffset),(snap)=>{
    if(ignoreNextSnapshot){ignoreNextSnapshot=false;return;}
    if(snap.exists()){
      applyRemoteState(snap.data());
      renderCurrent();
      setSyncStatus('synced');
    }
  },(e)=>{setSyncStatus('error');console.error(e);});
}

// ── SHEET PARSING ─────────────────────────────────────────────────────
function parseIngredients(raw){
  if(!raw)return[];
  return raw.split(';').map(s=>s.trim()).filter(Boolean).map(group=>{
    const idx=group.indexOf(':');if(idx<0)return null;
    return{cat:group.slice(0,idx).trim(),items:group.slice(idx+1).split('|').map(i=>i.trim()).filter(Boolean)};
  }).filter(Boolean);
}
function parseRow(row){
  const[nom,cat,feculents,legumes,ingredients]=row;
  if(!nom||nom==='Nom')return null;
  return{name:nom.trim(),cat:(cat||'vege').trim(),feculents:feculents?feculents.split('|').map(s=>s.trim()).filter(Boolean):[],legumes:legumes?legumes.split('|').map(s=>s.trim()).filter(Boolean):[],ingredients:parseIngredients(ingredients)};
}
function isSoup(d){return d.name.toLowerCase().includes('soupe')||d.name.toLowerCase().includes('gazpacho')||d.name.toLowerCase().includes('velouté');}

async function syncFromSheet(silent=false){
  if(!silent)setSyncStatus('syncing');
  try{
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(SHEET_TAB)}?key=${API_KEY}`;
    const res=await fetch(url);
    if(!res.ok)throw new Error(`Sheets ${res.status}`);
    const data=await res.json();
    const dishes=(data.values||[]).slice(1).map(parseRow).filter(Boolean);
    loadDishes(dishes);
    // Cache in Firestore so all devices benefit
    await setDoc(CACHE_DOC,{dishes,cachedAt:Date.now()});
    if(!silent)toast('Recettes synchronisées ✓');
    setSyncStatus('synced');
  }catch(e){
    if(!silent)toast('Erreur Sheet — cache utilisé');
    setSyncStatus('error');
    // Try Firestore cache
    try{
      const snap=await getDoc(CACHE_DOC);
      if(snap.exists())loadDishes(snap.data().dishes||[]);
    }catch(_){}
  }
}
function loadDishes(dishes){
  ALL_DISHES=[...dishes].sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  DB=ALL_DISHES.filter(d=>!isSoup(d));
  const soupsAll=ALL_DISHES.filter(d=>isSoup(d));
  SOUPS=isSummer()?soupsAll.filter(d=>d.name.toLowerCase().includes('froid')||d.name.toLowerCase().includes('gazpacho')):soupsAll.filter(d=>!d.name.toLowerCase().includes('froid')&&!d.name.toLowerCase().includes('gazpacho'));
  if(SOUPS.length===0)SOUPS=soupsAll;
}

// ── WEEK HELPERS ──────────────────────────────────────────────────────
function shouldSuggest(){
  if(weekOffset!==0)return false;
  if(!state.lastSuggest)return true;
  const ls=new Date(state.lastSuggest);ls.setHours(0,0,0,0);
  const start=new Date(getWeekStartKey(0));
  return ls<start;
}

async function navigateWeek(delta){
  weekOffset+=delta;
  state={weekPlan:{},validated:{},weekCustom:{},extraCourses:[],hygiene:[],epicerie:[],boissons:[],frais:[],legumes:[],checkedItems:[],hiddenItems:[]};
  checkedItems=new Set();hiddenItems=new Set();
  updateWeekHeader();
  setSyncStatus('syncing');
  try{
    const snap=await getDoc(stateDocForOffset(weekOffset));
    if(snap.exists())applyRemoteState(snap.data());
    setSyncStatus('synced');
  }catch(e){setSyncStatus('error');}
  listenState();
  if(shouldSuggest()&&!Object.values(state.weekPlan).some(Boolean))suggestWeek();
  else renderCurrent();
}

function updateWeekHeader(){
  document.getElementById('week-info').textContent=getWeekLabel(weekOffset);
  const prevLabel=weekOffset===0?'':weekOffset<0?`S${weekOffset}`:'+'+weekOffset;
  document.getElementById('week-offset-label').textContent=prevLabel;
}

// Samedi et dimanche ont chacun un créneau midi + un créneau soir ;
// les autres jours n'ont qu'un seul créneau (le soir).
function buildSlots(){
  const slots=[];
  DAYS.forEach(day=>{
    if(day==='Samedi'||day==='Dimanche'){
      slots.push({key:day+'_midi',day,label:day+' midi'});
      slots.push({key:day+'_soir',day,label:day+' soir'});
    }else{
      slots.push({key:day,day,label:day});
    }
  });
  return slots;
}

function suggestWeek(){
  if(!DB.length){toast('Recettes non chargées');return;}
  const usedF=[],usedL=[],avail=[...DB].sort(()=>Math.random()-.5);
  buildSlots().filter(s=>s.key!=='Dimanche_soir').forEach(slot=>{
    if(state.validated[slot.key])return;
    let best=null;
    for(let dish of avail){
      const fOk=(dish.feculents||[]).every(f=>!usedF.slice(-2).includes(f));
      const lOk=(dish.legumes||[]).every(l=>!usedL.slice(-2).includes(l));
      if(fOk&&lOk){best=dish;break;}
    }
    if(!best)best=avail[0];
    state.weekPlan[slot.key]=best?best.name:'';
    if(best){avail.splice(avail.indexOf(best),1);(best.feculents||[]).forEach(f=>usedF.push(f));(best.legumes||[]).forEach(l=>usedL.push(l));}
  });
  if(!state.validated['Dimanche_soir']&&SOUPS.length)state.weekPlan['Dimanche_soir']=SOUPS[Math.floor(Math.random()*SOUPS.length)].name;
  state.lastSuggest=new Date().toISOString();
  saveState();renderCurrent();toast('Semaine suggérée ✓');
}
function validateAll(){buildSlots().forEach(s=>{if(state.weekPlan[s.key])state.validated[s.key]=true;});saveState();renderCurrent();toast('Tout validé ✓');}
function toggleValidate(key){state.validated[key]=!state.validated[key];saveState();renderCurrent();}
function showTab(tab){currentTab=tab;['semaine','bdd','courses'].forEach(t=>{document.getElementById('nav-'+t).classList.toggle('active',t===tab);});renderCurrent();}

function renderSemaine(){
  const main=document.getElementById('main');main.innerHTML='';
  const bar=document.createElement('div');bar.className='suggest-bar';
  bar.innerHTML='<button class="btn btn-primary" onclick="window.suggestWeek()">✦ Suggérer la semaine</button><button class="btn" onclick="window.validateAll()">✓ Tout valider</button>';

  main.appendChild(legend);
  const settingsRow=document.createElement('div');

  const startLbl=document.createElement('span');startLbl.textContent='Semaine commence le';
  const startSel=document.createElement('select');startSel.className='day-select';startSel.style.width='auto';
  DAY_BY_JSIDX.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;if(d===weekStartDay)o.selected=true;startSel.appendChild(o);});
  startSel.onchange=()=>window.setWeekStartDay(startSel.value);

  const card=document.createElement('div');card.className='card';card.style.marginTop='.7rem';
  DAYS.forEach(day=>{

      groupHdr.textContent=day;
      card.appendChild(groupHdr);
      card.appendChild(buildSlotRow({key:day+'_midi',day,label:'Midi'}));
      card.appendChild(buildSlotRow({key:day+'_soir',day,label:'Soir'}));
    }else{
      card.appendChild(buildSlotRow({key:day,day,label:day}));
    }

  if(card.lastChild)card.lastChild.style.borderBottom='none';
  main.appendChild(card);

function buildSlotRow(slot){
  const isSoupSlot=slot.key==='Dimanche_soir';
  const wrapper=document.createElement('div');
  wrapper.style.cssText='border-bottom:0.5px solid var(--border);padding:.45rem 0;';
  const row=document.createElement('div');row.className='day-row';
  const label=document.createElement('span');
  label.className='day-label'+(isSoupSlot?' sun':'');
  label.innerHTML=isSoupSlot?`${slot.label} <span class="soup-tag">soupe</span>`:slot.label;
  const sel=document.createElement('select');
  const isCustom=state.weekCustom&&state.weekCustom[slot.key];
  sel.className='day-select'+(state.validated[slot.key]?' validated':(state.weekPlan[slot.key]||isCustom?' suggested':''));
  const optE=document.createElement('option');optE.value='';optE.textContent='— choisir —';sel.appendChild(optE);
  const optC=document.createElement('option');optC.value='__custom__';optC.textContent='✏️ Saisir librement…';sel.appendChild(optC);
  ALL_DISHES.forEach(dish=>{
    const opt=document.createElement('option');opt.value=dish.name;opt.textContent=dish.name;
    if(!isCustom&&state.weekPlan[slot.key]===dish.name)opt.selected=true;
    sel.appendChild(opt);
  });
  if(isCustom)sel.value='__custom__';
  const freeInp=document.createElement('input');
  freeInp.type='text';freeInp.placeholder='Nom du plat…';
  freeInp.style.cssText='display:none;width:100%;margin-top:5px;padding:.38rem .5rem;border-radius:var(--radius-sm);border:0.5px solid var(--teal-border);background:var(--teal-light);color:var(--text);font-family:inherit;font-size:12px;';
  if(isCustom){freeInp.style.display='block';freeInp.value=state.weekCustom[slot.key]||'';}
  sel.onchange=()=>{
    if(sel.value==='__custom__'){freeInp.style.display='block';freeInp.focus();state.weekPlan[slot.key]='';if(!state.weekCustom)state.weekCustom={};state.weekCustom[slot.key]=freeInp.value||'';}
    else{freeInp.style.display='none';state.weekPlan[slot.key]=sel.value;if(state.weekCustom)delete state.weekCustom[slot.key];}
    state.validated[slot.key]=false;sel.className='day-select'+(sel.value||freeInp.value?' suggested':'');saveState();
  };
  freeInp.oninput=()=>{if(!state.weekCustom)state.weekCustom={};state.weekCustom[slot.key]=freeInp.value;saveState();};
  const vBtn=document.createElement('button');vBtn.className='validate-btn'+(state.validated[slot.key]?' ok':'');
  vBtn.innerHTML='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  vBtn.onclick=()=>toggleValidate(slot.key);
  row.appendChild(label);row.appendChild(sel);row.appendChild(vBtn);
  wrapper.appendChild(row);wrapper.appendChild(freeInp);
  return wrapper;
}

    filters.appendChild(btn);
  });

function renderDishList(query,filter,container){
  container.innerHTML='';
  let pool=filter==='all'?DB:DB.filter(d=>d.cat===filter);
  if(query)pool=pool.filter(d=>d.name.toLowerCase().includes(query));
  if(pool.length===0){container.innerHTML='<div class="empty">Aucun plat trouvé</div>';return;}
  pool.forEach(dish=>{
    const row=document.createElement('div');row.className='dish-item';
    const name=document.createElement('span');name.className='dish-name-txt';name.textContent=dish.name;
    const badge=document.createElement('span');badge.className='cat-badge cat-'+dish.cat;badge.textContent={vege:'Végé',poisson:'Poisson',viande:'Viande'}[dish.cat]||dish.cat;
    const btn=document.createElement('button');btn.className='add-dish-btn';btn.textContent='+ Ajouter';
    btn.onclick=()=>{
      const slots=buildSlots();
      const free=slots.find(s=>!state.weekPlan[s.key]&&!state.validated[s.key])||slots[0];
      state.weekPlan[free.key]=dish.name;state.validated[free.key]=false;saveState();toast(`Ajouté ${free.label.toLowerCase()} ✓`);
    };
    row.appendChild(name);row.appendChild(badge);row.appendChild(btn);container.appendChild(row);
  });
}

async function submitNewDish(){
  const nom=addDishName.trim();
  const rows=addDishRows.filter(r=>r.text.trim());
  if(!nom){toast('Nom du plat manquant');return;}
  if(rows.length===0){toast('Ajoute au moins un ingrédient');return;}
  if(!ADD_RECIPE_URL){toast('Ajout non configuré — voir les instructions de déploiement');return;}

  const byCat={};
  rows.forEach(r=>{const c=r.cat,v=r.text.trim();if(!byCat[c])byCat[c]=[];byCat[c].push(v);});
  const ingredients=Object.entries(byCat).map(([c,items])=>`${c}:${items.join('|')}`).join(' ; ');
  const feculents=(byCat['Féculents']||[]).map(stripQty).join('|');
  const legumes=(byCat['Légumes']||[]).map(stripQty).join('|');
  const categorie=addDishCatOverride||guessCategorie(rows.map(r=>r.text));

  toast('Enregistrement…');
  try{
    const res=await fetch(ADD_RECIPE_URL,{method:'POST',body:JSON.stringify({secret:ADD_RECIPE_SECRET,nom,categorie,feculents,legumes,ingredients})});
    const data=await res.json().catch(()=>null);
    if(data&&data.ok===false){toast('Erreur : '+(data.error||'échec'));return;}
  }catch(e){console.error(e);} // la requête peut avoir réussi côté serveur même si la réponse n'est pas lisible ici (CORS)

  const newDish=parseRow([nom,categorie,feculents,legumes,ingredients]);
  if(newDish){
    ALL_DISHES=[...ALL_DISHES,newDish].sort((a,b)=>a.name.localeCompare(b.name,'fr'));
    DB=ALL_DISHES.filter(d=>!isSoup(d));
  }
  addDishOpen=false;addDishName='';addDishRows=[{text:'',cat:'Légumes'},{text:'',cat:'Légumes'},{text:'',cat:'Épices'}];addDishCatOverride=null;
  toast('Recette ajoutée ✓');
  renderCurrent();
  setTimeout(()=>syncFromSheet(true),3000); // laisse le temps au Sheet de propager, puis resynchronise depuis la source de vérité
}

// ── INGREDIENT GROUPING ─────────────────────────────────────────────────
// On ne cumule plus les quantités : chaque ingrédient est juste compté par
// nombre de recettes de la semaine qui l'utilisent, ex. "Courgette (3)".
function stripQty(item){
  let s=item.trim();
  s=s.replace(/\s*\([^)]*\)\s*$/,''); // "(250g)", "(2 cc)" en fin de chaîne
  s=s.replace(/^\d+(?:[.,]\d+)?\s*(kg|g|cl|ml|l|cs|cc)?\s+/i,''); // "2 ", "250g " en début
  return s.trim();
}
function mergeItems(items){
  const groups={};
  items.forEach(raw=>{
    const label=stripQty(raw);if(!label)return;
    const key=label.toLowerCase().replace(/s$/,''); // tolère singulier/pluriel
    if(!groups[key])groups[key]={label,n:0};
    groups[key].n++;
  });
  return Object.values(groups).map(g=>g.n>1?`${g.label} (${g.n})`:g.label);
}

// ── COURSES ───────────────────────────────────────────────────────────
const CAT_MAP={'Légumes':'Légumes & Fruits','Salade':'Légumes & Fruits','Garnitures':'Légumes & Fruits','Produits frais':'Frais','Légumineuses':'Épicerie','Féculents':'Épicerie','Protéines':'Frais','Épices':'_drop','Autres':'_split'};
const COND_KW=['huile','vinaigre','sauce','moutarde','pesto','curry','cumin','curcuma','paprika','ras el hanout','gingembre','garam','coriandre moulue','cannelle','harissa','origan','herbes','sel','poivre','muscade','piment','citron','cacahuètes','vin blanc','concentré','levure','wakame','miso','tamari','soja','sésame','fleur de sel'];
function classifyAutre(item){return COND_KW.some(k=>item.toLowerCase().includes(k))?null:'Épicerie';}

// ── AJOUT D'UN PLAT DEPUIS L'APP ────────────────────────────────────────
const ING_CATS=['Légumes','Légumineuses','Féculents','Protéines','Produits frais','Épices','Salade','Garnitures','Autres'];
const MEAT_KW=['poulet','dinde','viande','jambon','boeuf','bœuf','porc','canard','veau','agneau','lardons','chorizo','saucisse','bacon','merguez'];
const FISH_KW=['poisson','saumon','thon','cabillaud','crevette','moules','truite','colin','merlu','maquereau','sardine','anchois'];
function guessCategorie(items){
  const txt=items.join(' ').toLowerCase();
  if(FISH_KW.some(k=>txt.includes(k)))return'poisson';
  if(MEAT_KW.some(k=>txt.includes(k)))return'viande';
  return'vege';
}

function renderCourses(){
  const main=document.getElementById('main');main.innerHTML='';
  const hdr=document.createElement('div');hdr.className='courses-header';
  hdr.innerHTML='<span class="section-title">Liste de courses</span><button class="clear-btn" onclick="window.clearChecked()">Tout réafficher</button>';
  main.appendChild(hdr);
  const AUTO={Épicerie:[],Frais:[],'Légumes & Fruits':[]};
  buildSlots().forEach(slot=>{
    const n=state.weekPlan[slot.key];if(!n)return;
    const dish=ALL_DISHES.find(d=>d.name===n);if(!dish)return;
    dish.ingredients.forEach(g=>{
      const m=CAT_MAP[g.cat];
      g.items.forEach(item=>{
        if(m==='_drop')return;
        if(m==='_split'){const c=classifyAutre(item);if(c)AUTO[c].push(item);return;}
        if(m&&AUTO[m])AUTO[m].push(item);else AUTO['Épicerie'].push(item);
      });
    });
  });
  (state.extraCourses||[]).forEach(i=>AUTO['Épicerie'].push(i));
  const MERGED={};Object.keys(AUTO).forEach(k=>{MERGED[k]=new Set(mergeItems(AUTO[k]));});
  const SECTIONS=[
    {key:'Hygiène',icon:'🧴',items:new Set(),manualList:'hygiene'},
    {key:'Épicerie',icon:'🥫',items:MERGED['Épicerie'],manualList:'epicerie'},
    {key:'Boissons',icon:'🥤',items:new Set(),manualList:'boissons'},
    {key:'Frais',icon:'🥛',items:MERGED['Frais'],manualList:'frais'},
    {key:'Légumes & Fruits',icon:'🥦',items:MERGED['Légumes & Fruits'],manualList:'legumes'},
  ];
  ['hygiene','epicerie','boissons','frais','legumes'].forEach(k=>{const sec=SECTIONS.find(s=>s.manualList===k);if(sec)(state[k]||[]).forEach(i=>sec.items.add(i));});
  SECTIONS.forEach(sec=>{
    const card=document.createElement('div');card.className='card';card.style.marginBottom='.5rem';
    const t=document.createElement('div');t.style.cssText='font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-hint);margin-bottom:.5rem;';t.textContent=sec.icon+'  '+sec.key;card.appendChild(t);
    const addRow=document.createElement('div');addRow.className='course-add';
    const inp=document.createElement('input');inp.type='text';inp.placeholder='Ajouter...';inp.dataset.section=sec.manualList;
    inp.onkeydown=(e)=>{if(e.key==='Enter')addToSection(inp);};
    const addBtn=document.createElement('button');addBtn.textContent='+';addBtn.onclick=()=>addToSection(inp);
    addRow.appendChild(inp);addRow.appendChild(addBtn);card.appendChild(addRow);
    let hiddenCount=0;const hiddenEls=[];
    [...sec.items].forEach(item=>{
      if(hiddenItems.has(item)){
        hiddenCount++;
        const hRow=document.createElement('div');hRow.style.display='none';
        const rb=document.createElement('button');rb.style.cssText='font-size:11px;color:var(--text-hint);background:none;border:none;cursor:pointer;font-family:inherit;padding:2px 0;display:block;';rb.textContent='↩ '+item;
        rb.onclick=()=>{hiddenItems.delete(item);saveState();renderCourses();};
        hRow.appendChild(rb);card.appendChild(hRow);hiddenEls.push(hRow);return;
      }
      const row=document.createElement('div');row.className='ing-row';
      const cbId='cb_'+btoa(encodeURIComponent(item)).substring(0,12);
      const cb=document.createElement('input');cb.type='checkbox';cb.id=cbId;cb.checked=checkedItems.has(item);
      const lbl=document.createElement('label');lbl.htmlFor=cbId;lbl.textContent=item;if(checkedItems.has(item))lbl.className='done';
      cb.onchange=()=>{if(cb.checked)checkedItems.add(item);else checkedItems.delete(item);lbl.className=cb.checked?'done':'';saveState();};
      const rm=document.createElement('button');rm.className='remove-ing';rm.title="J'ai en stock";rm.textContent='×';
      rm.onclick=()=>{['hygiene','epicerie','boissons','frais','legumes','extraCourses'].forEach(k=>{if(Array.isArray(state[k]))state[k]=state[k].filter(x=>x!==item);});hiddenItems.add(item);saveState();renderCourses();toast('Retiré (en stock)');};
      row.appendChild(cb);row.appendChild(lbl);row.appendChild(rm);card.appendChild(row);
    });
    if(hiddenCount>0){
      const sh=document.createElement('button');sh.style.cssText='font-size:11px;color:var(--text-hint);background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 0;display:block;margin-top:.2rem;';sh.textContent=`▸ ${hiddenCount} en stock`;
      let exp=false;sh.onclick=()=>{exp=!exp;hiddenEls.forEach(el=>el.style.display=exp?'block':'none');sh.textContent=exp?`▾ ${hiddenCount} en stock`:`▸ ${hiddenCount} en stock`;};card.appendChild(sh);
    }
    main.appendChild(card);
  });
}
function addToSection(inp){const val=inp.value.trim(),sec=inp.dataset.section;if(!val||!sec)return;if(!state[sec])state[sec]=[];if(!state[sec].includes(val))state[sec].push(val);inp.value='';saveState();renderCourses();}
function clearChecked(){hiddenItems.clear();checkedItems.clear();saveState();renderCourses();toast('Liste réinitialisée');}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

// Expose to onclick handlers
window.suggestWeek=suggestWeek;
window.validateAll=validateAll;
window.clearChecked=clearChecked;
window.syncFromSheet=()=>syncFromSheet(false);
window.navigateWeek=navigateWeek;

// ── INIT ──────────────────────────────────────────────────────────────
setSyncStatus('syncing');

// 1. Load recipes (from Firestore cache first, then Sheet)
async function init(){
  // Load the week-start-day setting first — everything else (clé de semaine, ordre des jours) en dépend
  await loadSettings();
  updateWeekHeader();

  try{
    const snap=await getDoc(CACHE_DOC);
    if(snap.exists()&&snap.data().dishes?.length){
      loadDishes(snap.data().dishes);
    }
  }catch(_){}

  // Load current week state from Firestore
  try{
    const snap=await getDoc(stateDocForOffset(0));
    if(snap.exists())applyRemoteState(snap.data());
    setSyncStatus('synced');
  }catch(_){setSyncStatus('error');}

  // Start real-time listener for current week
  listenState();

  if(shouldSuggest()&&!Object.values(state.weekPlan).some(Boolean))suggestWeek();
  else renderCurrent();

  syncFromSheet(true);
}

init();
